<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Travel photo placeholder">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7eb8da"/>
      <stop offset="55%" stop-color="#b8d4e8"/>
      <stop offset="100%" stop-color="#e8f0f5"/>
    </linearGradient>
    <linearGradient id="hill-back" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6b5e"/>
      <stop offset="100%" stop-color="#3d4a40"/>
    </linearGradient>
    <linearGradient id="hill-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b8f71"/>
      <stop offset="100%" stop-color="#4a6b50"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#f5d76e" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
  <circle cx="980" cy="120" r="52" fill="url(#sun)" opacity="0.95"/>
  <ellipse cx="600" cy="520" rx="720" ry="180" fill="url(#hill-back)"/>
  <ellipse cx="600" cy="580" rx="780" ry="200" fill="url(#hill-front)"/>
  <path d="M0 420 Q200 380 400 400 T800 390 T1200 410 L1200 675 L0 675 Z" fill="#2d3a30" opacity="0.35"/>
  <g opacity="0.15" fill="#ffffff">
    <ellipse cx="180" cy="90" rx="90" ry="28"/>
    <ellipse cx="420" cy="130" rx="110" ry="32"/>
    <ellipse cx="700" cy="70" rx="80" ry="24"/>
  </g>
  <text x="600" y="640" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" opacity="0.85">The Travel Squad</text>
</svg>
